<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | SkillShare Campus</title>

  <!-- Bootstrap CSS (lewat CDN, tidak perlu instalasi) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS tambahan milik kita -->
  <link rel="stylesheet" href="css/style.css">

  <!-- JavaScript bersama (data dan fungsi yang dipakai semua halaman) -->
  <script src="js/script.js"></script>
</head>

<body class="bg-light">

  <main class="container py-5">
    <!-- ===== HALAMAN LOGIN (Anggota 1) ===== -->
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <p class="fw-bold text-primary mb-1">SKILLSHARE CAMPUS</p>
            <h1 class="h2 mb-3">Login</h1>
            <p class="text-muted">Selamat datang! Silakan masukkan akun kamu.</p>
            <p class="small bg-light border rounded p-2">
              Akun contoh: nama pengguna <strong>mahasiswa</strong>, kata sandi <strong>123456</strong>
            </p>

            <div id="pesan-error" class="alert alert-danger" style="display: none"></div>

            <form id="form-login" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">Nama pengguna</label>
                <input type="text" class="form-control" id="username">
              </div>
              <div class="mb-3">
                <label for="sandi" class="form-label">Kata sandi</label>
                <input type="password" class="form-control" id="sandi">
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <p class="mt-3 mb-0 text-center">Belum punya akun? <a href="daftar.html">Daftar di sini</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== JavaScript khusus halaman ini ===== -->
  <script>
    // Kalau sudah login, langsung ke Beranda
    if (ambilUser() !== null) {
      window.location.href = 'index.html';
    }

    // Saat tombol Login ditekan
    document.getElementById('form-login').addEventListener('submit', function (event) {
      event.preventDefault();      // cegah halaman refresh
      sembunyikanError();

      const nama = document.getElementById('username').value.trim();
      const sandi = document.getElementById('sandi').value;

      if (nama === '' || sandi === '') {
        tampilkanError('Nama pengguna dan kata sandi wajib diisi.');
        return;
      }

      // Cocokkan dengan daftar akun
      const semuaAkun = ambilAkun();
      let akunCocok = null;
      for (let i = 0; i < semuaAkun.length; i++) {
        if (semuaAkun[i].nama.toLowerCase() === nama.toLowerCase() && semuaAkun[i].sandi === sandi) {
          akunCocok = semuaAkun[i];
        }
      }

      if (akunCocok === null) {
        tampilkanError('Nama pengguna atau kata sandi salah.');
        return;
      }

      simpanUser(akunCocok.nama);
      window.location.href = 'index.html';   // pindah ke halaman Beranda
    });
  </script>
</body>
</html>
