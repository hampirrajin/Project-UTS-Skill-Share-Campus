  <main class="container py-4">
    <!-- ===== HALAMAN PETA (Anggota 6) ===== -->
    <h1 class="h2 text-center">Peta Lokasi Kelas</h1>
    <p class="text-center text-muted mb-1">Klik penanda untuk melihat kelas yang berlangsung di lokasi itu.</p>

    <div id="pesan-error" class="alert alert-warning" style="display: none"></div>

    <div id="peta" class="border rounded" style="height: 500px"></div>
  </main>

  <footer class="border-top bg-light text-center text-muted py-3 mt-5">
    &copy; 2026 SkillShare Campus &middot; Proyek UTS Pemrograman Web
  </footer>

  <!-- Bootstrap JS (supaya tombol menu di layar kecil berfungsi) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- ===== JavaScript khusus halaman ini ===== -->
  <script>
    siapkanNavbar();

    const semuaKelas = ambilKelas();

    // Cek dulu: adakah kelas yang lokasinya belum terdaftar di LOKASI_KAMPUS?
    let lokasiSalah = '';
    for (let i = 0; i < semuaKelas.length; i++) {
      if (LOKASI_KAMPUS[semuaKelas[i].lokasi] === undefined) {
        lokasiSalah += '"' + semuaKelas[i].lokasi + '" ';
      }
    }
    if (lokasiSalah !== '') {
      tampilkanError('Lokasi ' + lokasiSalah + 'belum ada di LOKASI_KAMPUS (js/script.js), jadi belum muncul di peta.');
    }

    if (typeof L === 'undefined') {
      // Leaflet gagal dimuat (biasanya karena internet mati)
      tampilkanError('Peta belum bisa dimuat. Cek koneksi internet, lalu muat ulang halaman.');
    } else {
      // 1) Buat peta dan pasang gambar petanya (OpenStreetMap)
      const peta = L.map('peta');
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(peta);

      // 2) Satu penanda untuk SETIAP lokasi di LOKASI_KAMPUS
      const semuaTitik = [];
      for (const namaLokasi in LOKASI_KAMPUS) {
        const titik = LOKASI_KAMPUS[namaLokasi];
        semuaTitik.push(titik);

        // Kumpulkan kelas-kelas yang ada di lokasi ini
        let daftarKelas = '';
        for (let i = 0; i < semuaKelas.length; i++) {
          const k = semuaKelas[i];
          if (k.lokasi === namaLokasi) {
            daftarKelas += `<li><a href="detail.html?id=${k.id}">${esc(k.nama)}</a><br>${esc(k.jadwal)}</li>`;
          }
        }
        if (daftarKelas === '') {
          daftarKelas = '<li>Belum ada kelas di sini.</li>';
        }

        // Pasang penanda. Klik penanda -> muncul popup.
        L.marker(titik)
          .addTo(peta)
          .bindPopup(`<strong>${esc(namaLokasi)}</strong><ul>${daftarKelas}</ul>`);
      }

      // 3) Atur tampilan peta otomatis supaya semua penanda terlihat
      peta.fitBounds(semuaTitik, { maxZoom: 17, padding: [30, 30] });
    }
  </script>
</body>
</html>
