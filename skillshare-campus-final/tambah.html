<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tambah Kelas | SkillShare Campus</title>

  <!-- Bootstrap CSS (lewat CDN, tidak perlu instalasi) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS tambahan milik kita -->
  <link rel="stylesheet" href="css/style.css">

  <!-- JavaScript bersama (data dan fungsi yang dipakai semua halaman) -->
  <script src="js/script.js"></script>
  <!-- Kalau belum login, otomatis dikirim ke halaman Login -->
  <script>wajibLogin();</script>
</head>

<body>

  <!-- ===== NAVBAR (sama di semua halaman setelah login) ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">SKILLSHARE CAMPUS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-utama" aria-controls="menu-utama" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu-utama">
        <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
        <li class="nav-item"><a class="nav-link" href="kelas.html">Daftar Kelas</a></li>
        <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Kelas</a></li>
        <li class="nav-item"><a class="nav-link" href="tabel.html">Data Pendaftaran</a></li>
        <li class="nav-item"><a class="nav-link" href="statistik.html">Statistik</a></li>
        <li class="nav-item"><a class="nav-link" href="peta.html">Peta</a></li>
        </ul>
        <span class="navbar-text me-3">Halo, <strong id="nama-user"></strong></span>
        <button type="button" id="tombol-keluar" class="btn btn-light btn-sm">Keluar</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <!-- ===== HALAMAN TAMBAH KELAS (Anggota 4) ===== -->
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <h1 class="h2 text-center mb-4">Tambah Kelas</h1>

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div id="pesan-error" class="alert alert-danger" style="display: none"></div>

            <form id="form-tambah" novalidate>
              <div class="mb-3">
                <label for="nama" class="form-label">Nama Kelas</label>
                <input type="text" class="form-control" id="nama" placeholder="Contoh: Belajar Ukulele 1 Jam">
              </div>

              <div class="mb-3">
                <label for="kategori" class="form-label">Kategori</label>
                <select class="form-select" id="kategori">
                  <option value="">-- Pilih Kategori --</option>
                  <option value="Musik">Musik</option>
                  <option value="Komputer">Komputer</option>
                  <option value="Komunikasi">Komunikasi</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="pengajar" class="form-label">Nama Pengajar</label>
                <input type="text" class="form-control" id="pengajar" placeholder="Nama kamu">
              </div>

              <div class="mb-3">
                <label for="jadwal" class="form-label">Jadwal</label>
                <input type="text" class="form-control" id="jadwal" placeholder="Contoh: Sabtu, 28 Nov 2026 - 10.00">
              </div>

              <div class="mb-3">
                <label for="lokasi" class="form-label">Lokasi di Kampus</label>
                <!-- Pilihan lokasi diisi otomatis dari LOKASI_KAMPUS di js/script.js -->
                <select class="form-select" id="lokasi">
                  <option value="">-- Pilih Lokasi --</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="kuota" class="form-label">Kuota (Jumlah Peserta)</label>
                <input type="number" class="form-control" id="kuota" min="1" max="100" placeholder="Contoh: 10">
              </div>

              <div class="mb-3">
                <label for="deskripsi" class="form-label">Deskripsi</label>
                <textarea class="form-control" id="deskripsi" rows="4" placeholder="Cerita singkat yang akan dipelajari"></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100">Simpan Kelas</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-top bg-light text-center text-muted py-3 mt-5">
    &copy; 2026 SkillShare Campus &middot; Proyek UTS Pemrograman Web
  </footer>

  <!-- Bootstrap JS (supaya tombol menu di layar kecil berfungsi) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ===== JavaScript khusus halaman ini ===== -->
  <script>
    siapkanNavbar();

    // Isi nama pengajar otomatis dengan nama akun yang login (boleh diganti)
    document.getElementById('pengajar').value = ambilUser();

    // Isi pilihan lokasi dari daftar LOKASI_KAMPUS (ada di js/script.js)
    for (const namaLokasi in LOKASI_KAMPUS) {
      document.getElementById('lokasi').innerHTML += '<option value="' + esc(namaLokasi) + '">' + esc(namaLokasi) + '</option>';
    }

    // Saat tombol Simpan Kelas ditekan
    document.getElementById('form-tambah').addEventListener('submit', function (event) {
      event.preventDefault();
      sembunyikanError();

      const nama = document.getElementById('nama').value.trim();
      const kategori = document.getElementById('kategori').value;
      const pengajar = document.getElementById('pengajar').value.trim();
      const jadwal = document.getElementById('jadwal').value.trim();
      const lokasi = document.getElementById('lokasi').value;
      const kuota = Number(document.getElementById('kuota').value);
      const deskripsi = document.getElementById('deskripsi').value.trim();

      // Cek isian satu per satu. Kalau ada yang salah, tampilkan pesan lalu berhenti.
      if (nama.length < 5) {
        tampilkanError('Nama kelas minimal 5 karakter.');
        return;
      }
      if (kategori === '') {
        tampilkanError('Pilih salah satu kategori.');
        return;
      }
      if (pengajar.length < 3) {
        tampilkanError('Nama pengajar minimal 3 karakter.');
        return;
      }
      if (jadwal.length < 5) {
        tampilkanError('Isi jadwal, contoh: Sabtu, 28 Nov 2026 - 10.00');
        return;
      }
      if (lokasi === '') {
        tampilkanError('Pilih lokasi di kampus.');
        return;
      }
      if (Number.isInteger(kuota) === false || kuota < 1 || kuota > 100) {
        tampilkanError('Kuota harus angka bulat antara 1 sampai 100.');
        return;
      }
      if (deskripsi.length < 15) {
        tampilkanError('Deskripsi minimal 15 karakter.');
        return;
      }

      // Semua benar: tambahkan kelas baru ke daftar lalu simpan
      const semuaKelas = ambilKelas();
      semuaKelas.push({
        id: semuaKelas.length + 1,
        nama: nama,
        kategori: kategori,
        pengajar: pengajar,
        jadwal: jadwal,
        lokasi: lokasi,
        kuota: kuota,
        deskripsi: deskripsi
      });
      simpanKelas(semuaKelas);

      alert('Kelas "' + nama + '" berhasil disimpan.');
      window.location.href = 'kelas.html';
    });
  </script>
</body>
</html>
